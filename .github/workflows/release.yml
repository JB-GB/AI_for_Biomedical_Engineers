# Desktop release: on a version tag (vX.Y.Z), build the Windows bundle with its workspace seed,
# run the self-test, zip it and publish a GitHub Release with the zip and its SHA-256.
# The tag must match rausnet.__version__ and docs/releases/<tag>.md holds the notes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build again (assets are replaced)"
        required: true

permissions:
  contents: write  # create the release and upload its assets

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the app (no PyTorch) and PyInstaller
        run: python -m pip install -q -e ".[serve,ui]" "pyinstaller==6.22.3"
      - name: Tag matches the package version and has notes
        shell: bash
        run: |
          version="v$(python -c 'import rausnet; print(rausnet.__version__)')"
          test "$version" = "$TAG" || { echo "tag $TAG != package $version"; exit 1; }
          test -f "docs/releases/$TAG.md" || { echo "missing docs/releases/$TAG.md"; exit 1; }
      - name: Build, self-test with the workspace seed, zip
        run: python scripts/build_installer.py --zip
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(dist/RAUSNet-*-windows-x64.zip dist/RAUSNet-*-windows-x64.zip.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "RAUSNet $TAG" \
              --notes-file "docs/releases/$TAG.md" --prerelease --verify-tag
          fi
