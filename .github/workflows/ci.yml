# Lint + unit tests on GitHub-hosted runners (free minutes). Synthetic data only, no secrets.
name: ci

on:
  push:
    branches: [main, PIA_devl]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (CPU torch)
        run: |
          python -m pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -e ".[train,serve,ui,dev,paper]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: python -m pytest -q -p no:warnings
