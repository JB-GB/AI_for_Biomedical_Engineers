# Retraining: python -m rausnet.retrain --config configs/retrain/default.yaml --add <manifest> [--add ...]
# The first call (empty registry) trains from scratch; later calls fine-tune the current model.
# A promoted model is calibrated and exported to ONNX automatically (section postprocess);
# add --no-postprocess to skip both.
output_dir: outputs
models_dir: models          # registry.json + one folder per version (git-ignored)

data:
  root: ${RAUSNET_DATA_DIR}  # data root; --add manifests must live inside it
  image_size: 224
  split_ratios: [0.70, 0.15, 0.15]
  split_salt: rausnet-split-v1   # never change: keeps the test set frozen across versions
  augment: basic             # basic | us

model:                       # used only for the first model; later versions reuse the parent's
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.2

train:
  epochs: 30                 # first model
  finetune_epochs: 10        # later versions
  batch_size: 32
  lr: 3.0e-4
  finetune_lr: 1.0e-4
  weight_decay: 1.0e-4
  class_weighting: true
  pd_mask_gs0: true       # no PD loss on GS 0 joints: PD is undefined without synovium
  amp: true
  num_workers: 0
  patience: 8
  seed: 42

promotion:
  rule: bootstrap            # bootstrap | tolerance
  # bootstrap: paired patient-level bootstrap of (candidate - current) combined QWK on the same
  # frozen test split; rejected only if the whole 95 % CI is below 0 (significantly worse).
  n_boot: 2000
  seed: 0
  # tolerance: promoted if candidate metric >= current - tolerance.
  metric: qwk
  tolerance: 0.0
  sources: null              # e.g. [hospital] to judge only on clinical test images

postprocess:                 # only after a promotion; failures are logged and never undo it
  calibrate: true            # rausnet.calibrate -> models/<v>/calibration.json
  target_accuracy: 0.98      # refer-to-specialist threshold target (val split); a clinical choice
  gate: true                 # keep temperatures only where cross-fitting shows they help
  export: true               # rausnet.export -> models/<v>/model.onnx + model.json (needs onnx, onnxscript)
