[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rausnet"
version = "0.1.0"
description = "Retrainable EULAR-OMERACT synovitis grading on joint ultrasound (research use only)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.scripts]
rausnet-synth = "rausnet.data.synthetic:main"
rausnet-api = "rausnet.serve.api:main"
rausnet-desktop = "rausnet.ui.app:main"

[project.optional-dependencies]
train = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0", "mlflow>=2.14", "pyyaml>=6.0", "onnx>=1.16"]
serve = ["fastapi>=0.111", "uvicorn>=0.30", "onnxruntime>=1.18", "python-multipart>=0.0.9"]
ui = ["PySide6>=6.7", "httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5", "nbstripout>=0.7"]
paper = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
